name: Manual workflow

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build iwasm (Release)
        shell: pwsh
        run: |
          cd product-mini/platforms/windows/
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
          # ./Release/iwasm.exe is generated
