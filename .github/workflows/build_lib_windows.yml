name: Build Windows libiwasm

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build libiwasm (Release)
        shell: pwsh
        run: |
          cd product-mini/platforms/windows/
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=ON
          cmake --build . --config Release

      - name: Upload libiwasm.dll
        uses: actions/upload-artifact@v4
        with:
          name: libiwasm-windows-release
          path: product-mini/platforms/windows/build/Release/libiwasm.dll
          if-no-files-found: error
